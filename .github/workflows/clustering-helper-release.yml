name: Build & Release clustering-helper

# Source for this workflow lives in the Haritica monorepo at
# helper-repo/.github/workflows/release.yml; this is the public-repo copy,
# adapted to build from the clustering-helper/ subdirectory (the repo root
# also hosts the cloud gpl-extras image, so the helper sources are kept in
# their own subdir). Triggered by `clustering-helper-vMAJOR.MINOR.PATCH` tags;
# the Haritica desktop installer pins the exact tag in
# analyses/optional_tools.py::_CLUSTERING_HELPER_TAG.
on:
  push:
    tags: ["clustering-helper-v*.*.*"]
  workflow_dispatch: {}

# action-gh-release creates a Release, which needs contents:write. The default
# GITHUB_TOKEN is read-only on many repos, so this must be explicit (otherwise
# the upload fails with 403 "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  pre-release-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clustering-helper
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholder LICENSE (GPL-3 §6 — binary must ship real license)
        run: |
          if grep -q PLACEHOLDER LICENSE; then
            echo "LICENSE still contains placeholder text. Run scripts/fetch-license.sh before tagging."
            exit 1
          fi

  build-native:
    needs: pre-release-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: haritica-clustering-helper-x86_64-pc-windows-msvc
          - os: macos-14            # Apple Silicon arm64 (native)
            asset: haritica-clustering-helper-aarch64-apple-darwin
          - os: macos-14            # x86_64 cross-built under Rosetta 2
            asset: haritica-clustering-helper-x86_64-apple-darwin
            x86_darwin: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clustering-helper
    steps:
      - uses: actions/checkout@v4
      # Native CPython for Windows + macOS arm64.
      - uses: actions/setup-python@v5
        if: ${{ ! matrix.x86_darwin }}
        with:
          python-version: "3.11"
      - name: Select native python
        if: ${{ ! matrix.x86_darwin }}
        shell: bash
        run: echo "PYBIN=python" >> "$GITHUB_ENV"
      # GitHub's macos-13 (Intel) runners are deprecated and queue for hours, so
      # the x86_64 macOS binary is cross-built on the always-available macos-14
      # (arm64) runner: a standalone x86_64 CPython runs under Rosetta 2, so
      # PyInstaller emits an x86_64 Mach-O. (Validated locally on Apple Silicon.)
      - name: Set up x86_64 Python via Rosetta 2
        if: ${{ matrix.x86_darwin }}
        shell: bash
        run: |
          set -euo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/20260602/cpython-3.11.15%2B20260602-x86_64-apple-darwin-install_only.tar.gz"
          curl -fsSL "$URL" -o /tmp/py-x86.tar.gz
          tar xzf /tmp/py-x86.tar.gz -C /tmp
          PYBIN=/tmp/python/bin/python3.11
          "$PYBIN" -c "import platform; assert platform.machine()=='x86_64', platform.machine(); print('x86_64 python OK')"
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
      - name: Install deps
        shell: bash
        run: $PYBIN -m pip install -r requirements.txt pyinstaller
      - name: Smoke-import deps (catches stale requirements.txt before the build)
        shell: bash
        run: $PYBIN -c "import anndata, igraph, leidenalg, louvain, numpy, scipy, sklearn.neighbors, h5py, pkg_resources; print('deps ok')"
      - name: Build (onedir)
        shell: bash
        run: $PYBIN -m PyInstaller --clean pyinstaller.spec --noconfirm
      - name: Assert bundle layout
        shell: bash
        run: |
          set -euo pipefail
          B=dist/haritica-clustering-helper
          test -d "$B" || { echo "missing $B"; ls -R dist; exit 1; }
          test -d "$B/_internal" || { echo "missing _internal/"; exit 1; }
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "$B/haritica-clustering-helper.exe" || { echo "missing launcher .exe"; exit 1; }
          else
            test -f "$B/haritica-clustering-helper" || { echo "missing launcher"; exit 1; }
          fi
      - name: Verify macOS ad-hoc signature + linkage (mandatory on Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          L=dist/haritica-clustering-helper/haritica-clustering-helper
          codesign --verify --deep --verbose=2 "$L"
          otool -L "$L" | head -20
          "$L" --version
      - name: Smoke --version (Windows)
        if: runner.os == 'Windows'
        run: dist\haritica-clustering-helper\haritica-clustering-helper.exe --version
      - name: Package onedir bundle (contents at ZIP ROOT)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          B=dist/haritica-clustering-helper
          ZIP="out/${{ matrix.asset }}.zip"
          # The installer (optional_tools.download_tool) extracts the zip and
          # expects the launcher AND _internal/ at the ZIP ROOT — it relocates
          # only the launcher file, never a nested _internal/. So the archive
          # must be rooted at the bundle CONTENTS, not the parent dir.
          if [ "${{ runner.os }}" = "macOS" ]; then
            # ditto WITHOUT --keepParent roots the archive at the dir contents
            # and preserves Mach-O bytes (the ad-hoc signature) + symlinks.
            ditto -c -k "$B" "$ZIP"
          else
            # Windows: python zipfile rooted at the bundle contents. Avoids
            # git-bash/PowerShell path-translation quirks; exec bits + symlinks
            # don't matter on Windows, and download_tool re-applies +x on POSIX.
            python - "$B" "$ZIP" <<'PY'
          import os, sys, zipfile
          bundle, zippath = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(zippath, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _dirs, files in os.walk(bundle):
                  for fn in files:
                      full = os.path.join(root, fn)
                      zf.write(full, os.path.relpath(full, bundle))  # contents at root
          print("wrote", zippath)
          PY
          fi
      - name: Verify zip is rooted at bundle contents (NOT nested)
        shell: bash
        run: |
          set -euo pipefail
          python - "out/${{ matrix.asset }}.zip" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          tops = sorted({n.split('/')[0] for n in names if n})
          launcher = "haritica-clustering-helper.exe" if any(n.endswith(".exe") for n in names) else "haritica-clustering-helper"
          assert launcher in names, f"launcher {launcher!r} not at zip root; top entries: {tops[:12]}"
          assert any(n == "_internal/" or n.startswith("_internal/") for n in names), f"_internal/ not at zip root; top entries: {tops[:12]}"
          print("zip root OK:", launcher, "+ _internal/")
          PY
      - name: SHA256
        shell: bash
        run: |
          set -euo pipefail
          ZIP="out/${{ matrix.asset }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile "$ZIP" SHA256 | sed -n '2p' | tr -d ' \r' > "$ZIP.sha256"
          else
            shasum -a 256 "$ZIP" | cut -d' ' -f1 > "$ZIP.sha256"
          fi
          cat "$ZIP.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            clustering-helper/out/${{ matrix.asset }}.zip
            clustering-helper/out/${{ matrix.asset }}.zip.sha256
            clustering-helper/WRITTEN_OFFER.txt
            clustering-helper/LICENSE
